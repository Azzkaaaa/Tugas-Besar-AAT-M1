# Standalone local Auth + SPA. Run with --env-file .env.auth.
# Fixed URLs are intentional: OIDC issuer, callback, and proxy host must agree.
name: bnpb-auth

# Template variables for services/envoy/templates (see services/envoy/envoy.env.example).
x-envoy-env: &envoy-env
  ENVOY_LISTEN_PORT: "8080"
  ENVOY_HEALTH_PATH: /healthz
  APP_HOST: localhost
  APP_ORIGIN: http://localhost:8080
  AUTH_HOST: auth.localhost
  AUTH_ROUTE_PREFIX: /auth/
  API_ROUTE_PREFIX: /api/
  LOGIN_UI_ROUTE_PREFIX: /ui/v2/login
  ZITADEL_ADDRESS: zitadel
  ZITADEL_PORT: "8080"
  ZITADEL_LOGIN_ADDRESS: zitadel-login
  ZITADEL_LOGIN_PORT: "3000"
  AUTH_BRIDGE_ADDRESS: auth-bridge
  AUTH_BRIDGE_PORT: "3001"
  SPA_ADDRESS: spa-server
  SPA_PORT: "80"
  # REST contract → gRPC. Business services are absent in this standalone stack, so
  # authenticated API calls get a 503 problem from the gateway.
  API_GATEWAY_ADDRESS: api-gateway
  API_GATEWAY_PORT: "8080"
  # OTLP/gRPC collector (otel-lgtm in compose.yaml; absent here, so traces are dropped).
  OTEL_COLLECTOR_ADDRESS: otel-lgtm
  OTEL_COLLECTOR_GRPC_PORT: "4317"
  # ext_authz gRPC service that performs the RFC 8693 exchange (see token-exchange below).
  TOKEN_EXCHANGE_ADDRESS: token-exchange
  TOKEN_EXCHANGE_PORT: "9000"
  TOKEN_EXCHANGE_TIMEOUT: 6s
  AUTH_ACCESS_COOKIE: bnpb_access
  AUTH_COOKIE_PREFIX: bnpb_
  # Development only: lets a request with TRACE_ESCAPE_HATCH_HEADER read its trace id from the
  # x-trace-id response header. Responses carry no trace identifiers otherwise.
  TRACE_ESCAPE_HATCH_ENABLED: "${TRACE_ESCAPE_HATCH_ENABLED:-false}"
  TRACE_ESCAPE_HATCH_HEADER: x-bnpb-trace-debug

services:
  auth-db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: zitadel
      POSTGRES_PASSWORD: "${AUTH_POSTGRES_PASSWORD:?Run python tools/setup_auth_env.py}"
    volumes:
      - auth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d zitadel"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [bnpb_net]

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    user: "0"
    command: [start-from-init, --masterkey, "${ZITADEL_MASTERKEY:?Run python tools/setup_auth_env.py}"]
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: auth.localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: "postgresql://postgres:${AUTH_POSTGRES_PASSWORD}@auth-db:5432/zitadel?sslmode=disable"
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: BNPB M1 Local
      ZITADEL_FIRSTINSTANCE_ORG_NAME: BNPB
      ZITADEL_FIRSTINSTANCE_PATPATH: /bootstrap/admin/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: auth-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Local provisioning
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /bootstrap/login/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login UI
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://auth.localhost:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://auth.localhost:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://auth.localhost:8080/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: http://auth.localhost:8080/ui/v2/login/login?samlRequest=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
      # Local stack only: the default deny list blocks 172.16.0.0/12, where Docker places
      # bnpb_net, so Zitadel could not call the zitadel-claims Actions target. Do not reuse.
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,192.168.0.0/16,198.18.0.0/15,::/128,::1/128,fc00::/7,fe80::/10"
    volumes:
      - zitadel_admin_bootstrap:/bootstrap/admin
      - zitadel_login_bootstrap:/bootstrap/login
    depends_on:
      auth-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    # Split-horizon DNS: inside bnpb_net the public issuer host resolves to Zitadel itself, so
    # services fetch discovery, JWKS and tokens without hairpinning through Envoy. Browsers on
    # the host resolve *.localhost to loopback and reach the same URL through Envoy's published
    # port. Both views share http://auth.localhost:8080, so ZITADEL_PORT, ZITADEL_EXTERNALPORT
    # and Envoy's published port must stay equal.
    networks:
      bnpb_net:
        aliases: [auth.localhost, zitadel.local]

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.0
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: "${LOGIN_SESSION_COOKIE_SECRET:?Run python tools/setup_auth_env.py}"
      CUSTOM_REQUEST_HEADERS: Host:auth.localhost,X-Forwarded-Proto:http
    volumes:
      - zitadel_login_bootstrap:/bootstrap:ro
    depends_on:
      zitadel: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /app/healthcheck.mjs, http://localhost:3000/ui/v2/login/healthy]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [bnpb_net]

  auth-bootstrap:
    image: node:24-alpine
    command: [node, /scripts/bootstrap.mjs]
    restart: "no"
    environment:
      OIDC_ISSUER: http://auth.localhost:8080
      APP_PUBLIC_URL: http://localhost:8080
      # Direct to Zitadel: the gateway starts only after this job writes its credentials.
      ZITADEL_API_URL: http://zitadel:8080
      ZITADEL_API_HOST: auth.localhost:8080
      ACTIONS_CLAIMS_ENDPOINT: http://zitadel-claims:3002/claims
      ZITADEL_ADMIN_PAT_FILE: /admin/admin.pat
      OIDC_CONFIG_FILE: /bootstrap/oidc.json
      ACTIONS_CONFIG_FILE: /actions/actions.json
      SERVICE_ACCOUNTS_DIR: /service-accounts
      AUTH_ADMIN_PASSWORD: "${AUTH_ADMIN_PASSWORD:?Run python tools/setup_auth_env.py}"
      AUTH_MEDIA_PASSWORD: "${AUTH_MEDIA_PASSWORD:?Run python tools/setup_auth_env.py}"
      AUTH_FIELD_TEAM_PASSWORD: "${AUTH_FIELD_TEAM_PASSWORD:?Run python tools/setup_auth_env.py}"
      AUTH_BNPB_PASSWORD: "${AUTH_BNPB_PASSWORD:?Run python tools/setup_auth_env.py}"
      ZITADEL_ACCESS_TOKEN_TTL_SECONDS: "${ZITADEL_ACCESS_TOKEN_TTL_SECONDS:-60}"
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-86400}"
    volumes:
      - ./services/zitadel/bootstrap.mjs:/scripts/bootstrap.mjs:ro
      - zitadel_admin_bootstrap:/admin:ro
      - auth_client_config:/bootstrap
      - auth_actions_config:/actions
      # Service-user secrets and project ID for local scripts; .cache/ is gitignored.
      - ./.cache/auth:/service-accounts
    depends_on:
      zitadel: {condition: service_healthy}
      # Zitadel resolves the Actions target host when the target is created.
      zitadel-claims: {condition: service_started}
    networks: [bnpb_net]

  # Zitadel Actions v2 target: appends role/scopes claims to userinfo, introspection and JWT access tokens.
  zitadel-claims:
    build:
      context: .
      dockerfile: services/zitadel-claims/Dockerfile
    environment:
      PORT: 3002
      ACTIONS_CONFIG_FILE: /actions/actions.json
    volumes:
      # Own volume: signing key and filter IDs only, no client secrets.
      - auth_actions_config:/actions:ro
    # Starts before auth-bootstrap and waits for actions.json (see config::provisioned).
    healthcheck:
      test: [CMD, /zitadel-claims, --healthcheck]
      start_period: 300s
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [bnpb_net]

  auth-bridge:
    build:
      context: .
      dockerfile: services/auth-bridge/Dockerfile
    environment:
      PORT: 3001
      APP_PUBLIC_URL: http://localhost:8080
      OIDC_ISSUER: http://auth.localhost:8080
      OIDC_CONFIG_FILE: /bootstrap/oidc.json
      AUTH_ALLOW_HTTP: "true"
      AUTH_COOKIE_SECURE: "false"
      AUTH_SESSION_KEY: "${AUTH_SESSION_KEY:?Run python tools/setup_auth_env.py}"
      # Sessions shared by every replica (ephemeral: a Redis restart logs everyone out).
      AUTH_REDIS_URL: redis://auth-redis:6379/0
      AUTH_SESSION_TTL_SECONDS: "${AUTH_SESSION_TTL_SECONDS:-86400}"
    volumes:
      - auth_client_config:/bootstrap:ro
    # Starts before auth-bootstrap and waits for oidc.json (see provisionedConfig in server.mjs).
    depends_on:
      zitadel: {condition: service_healthy}
      auth-redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      start_period: 300s
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [bnpb_net]

  # auth-bridge sessions, login transactions and refresh locks. Ephemeral by choice: losing it
  # logs every user out, while Zitadel still rejects revoked tokens. noeviction makes a full
  # Redis fail writes instead of silently dropping sessions.
  auth-redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [bnpb_net]

  spa-server:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: "${FRONTEND_DATA_MODE:-mock}"
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases: [spa-server.local]

  # Implements contracts/openapi/gateway.yaml over the gRPC backends (see services/api-gateway).
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      GATEWAY_HTTP_PORT: "8080"
      AGGREGATOR_GRPC_ADDRESS: "${AGGREGATOR_GRPC_ADDRESS:-aggregator-service:9091}"
      NOTIFICATION_GRPC_ADDRESS: "${NOTIFICATION_GRPC_ADDRESS:-notification-service:9095}"
      WEBHOOK_GRPC_ADDRESS: "${WEBHOOK_GRPC_ADDRESS:-webhook-provider:9094}"
      EVENT_FEED_GRPC_ADDRESS: "${EVENT_FEED_GRPC_ADDRESS:-feed-service:9093}"
      GATEWAY_REQUEST_TIMEOUT_MS: "${GATEWAY_REQUEST_TIMEOUT_MS:-2000}"
      GATEWAY_MAX_IN_FLIGHT: "${GATEWAY_MAX_IN_FLIGHT:-100}"
      GATEWAY_RETRY_AFTER_SECONDS: "${GATEWAY_RETRY_AFTER_SECONDS:-5}"
      GATEWAY_SSE_HEARTBEAT_SECONDS: "${GATEWAY_SSE_HEARTBEAT_SECONDS:-15}"
    healthcheck:
      test: [CMD, /api-gateway, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases: [api-gateway.local]

  # Envoy ext_authz target: exchanges the opaque access token for a JWT (RFC 8693) with the
  # gateway client from oidc.json, in a traced call to Zitadel.
  token-exchange:
    build:
      context: .
      dockerfile: services/token-exchange/Dockerfile
    environment:
      TOKEN_EXCHANGE_GRPC_PORT: "9000"
      # Split-horizon DNS: auth.localhost is Zitadel itself inside bnpb_net.
      TOKEN_EXCHANGE_URL: http://auth.localhost:8080/oauth/v2/token
      TOKEN_EXCHANGE_TIMEOUT_MS: "5000"
      OIDC_CONFIG_FILE: /bootstrap/oidc.json
    volumes:
      # Gateway token-exchange client written by auth-bootstrap.
      - auth_client_config:/bootstrap:ro
    depends_on:
      auth-bootstrap: {condition: service_completed_successfully}
      zitadel: {condition: service_healthy}
    healthcheck:
      test: [CMD, /token-exchange, --healthcheck]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases: [token-exchange.local]

  # Edge proxy: SPA, Auth bridge, hosted login, and cookie → token exchange → api-gateway.
  envoy:
    build:
      context: .
      dockerfile: services/envoy/Dockerfile
    environment: *envoy-env
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      token-exchange: {condition: service_healthy}
      auth-bridge: {condition: service_healthy}
      zitadel-login: {condition: service_healthy}
      api-gateway: {condition: service_healthy}
    restart: unless-stopped
    networks:
      bnpb_net:
        # No auth.localhost here: that name is Zitadel's inside the network (see zitadel above).
        aliases: [envoy.local]

networks:
  bnpb_net:
    driver: bridge
volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_actions_config:
