# Edge proxy: SPA, Auth bridge, Zitadel hosted login, and authenticated /api/ traffic, which
# is forwarded to the api-gateway service (REST contract → gRPC backends).
# Rendered by docker-entrypoint.sh with envsubst; every substituted variable is listed there.

# Envoy metrics, pushed over OTLP/gRPC.
stats_sinks:
  - name: envoy.stat_sinks.open_telemetry
    typed_config:
      "@type": type.googleapis.com/envoy.extensions.stat_sinks.open_telemetry.v3.SinkConfig
      grpc_service:
        envoy_grpc: { cluster_name: otel_collector }

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: ${ENVOY_LISTEN_PORT} }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: gateway
                codec_type: AUTO
                use_remote_address: true
                # Header names with underscores can alias dashed names in some upstreams.
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                # Clients never choose the trace: their trace context is dropped before route
                # selection and before the tracer reads it, so every trace starts here. Internal
                # callers reach Zitadel directly (split-horizon DNS), never through this listener.
                early_header_mutation_extensions:
                  - name: bnpb.strip_inbound_trace_headers
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.early_header_mutation.header_mutation.v3.HeaderMutation
                      mutations:
                        - remove: traceparent
                        - remove: tracestate
                        - remove: baggage
                        - remove: b3
                        - remove: x-b3-traceid
                        - remove: x-b3-spanid
                        - remove: x-b3-parentspanid
                        - remove: x-b3-sampled
                        - remove: x-b3-flags
                        - remove: uber-trace-id
                        - remove: x-ot-span-context
                        - remove: grpc-trace-bin
                        - remove: x-cloud-trace-context
                        - remove: x-amzn-trace-id
                        - remove: x-datadog-trace-id
                        - remove: x-datadog-parent-id
                        - remove: x-datadog-sampling-priority
                        - remove: x-request-id
                # Access logs are omitted: OIDC callbacks contain single-use codes.
                # Spans record the full URL too, so the callback route below is never sampled.
                tracing:
                  spawn_upstream_span: true
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      grpc_service:
                        envoy_grpc: { cluster_name: otel_collector }
                        timeout: 1s
                      service_name: envoy
                route_config:
                  name: gateway_routes
                  # trace_headers.lua removes this unless the development escape hatch is on.
                  response_headers_to_add:
                    - header: { key: x-trace-id, value: "%TRACE_ID%" }
                      append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  virtual_hosts:
                    - name: zitadel
                      domains: ["${AUTH_HOST}", "${AUTH_HOST}:*"]
                      # The API filters never apply to the identity provider.
                      typed_per_filter_config: &api_filters_disabled
                        bnpb.cookie_to_bearer:
                          "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                          disabled: true
                        bnpb.token_exchange:
                          "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
                          disabled: true
                      routes:
                        - match: { path: / }
                          redirect: { path_redirect: "${LOGIN_UI_ROUTE_PREFIX}/" }
                        - match: { prefix: "${LOGIN_UI_ROUTE_PREFIX}" }
                          route: { cluster: zitadel_login, timeout: 30s }
                        - match: { prefix: / }
                          route: { cluster: zitadel, timeout: 30s }

                    - name: application
                      domains: ["${APP_HOST}", "${APP_HOST}:*"]
                      routes:
                        # Liveness of the listener and filter chain for the health probe; never traced.
                        - match: { path: "${ENVOY_HEALTH_PATH}" }
                          direct_response: { status: 200 }
                          typed_per_filter_config: *api_filters_disabled
                          tracing:
                            overall_sampling: { numerator: 0 }

                        # Same as the prefix route below, but untraced: the query holds the OIDC code.
                        - match: { path: "${AUTH_ROUTE_PREFIX}callback" }
                          route: { cluster: auth_bridge, timeout: 30s }
                          typed_per_filter_config: *api_filters_disabled
                          tracing:
                            overall_sampling: { numerator: 0 }

                        - match: { prefix: "${AUTH_ROUTE_PREFIX}" }
                          route: { cluster: auth_bridge, timeout: 30s }
                          typed_per_filter_config: *api_filters_disabled

                        # Authenticated and exchanged above; api-gateway implements the REST
                        # contract. No route timeout: feeds are long-lived SSE responses kept
                        # alive by the gateway's heartbeat comments.
                        - match: { prefix: "${API_ROUTE_PREFIX}" }
                          route: { cluster: api_gateway, timeout: 0s }

                        - match: { prefix: / }
                          route: { cluster: spa, timeout: 30s }
                          typed_per_filter_config: *api_filters_disabled

                # Gateway-generated errors use the same problem+json shape as the Auth bridge.
                local_reply_config:
                  mappers:
                    - filter:
                        status_code_filter:
                          comparison:
                            op: GE
                            value: { default_value: 400, runtime_key: gateway.local_reply.problem_min_status }
                      body_format_override:
                        content_type: application/problem+json
                        json_format:
                          type: urn:bnpb:gateway:error
                          title: "%RESPONSE_CODE_DETAILS%"
                          status: "%RESPONSE_CODE%"
                          detail: "%LOCAL_REPLY_BODY%"

                http_filters:
                  # 0. Trace-header boundary: removes the escape-hatch header from requests and
                  #    trace identifiers from responses. First, and never disabled per route, so
                  #    it sees every response, including local replies from the filters below.
                  - name: bnpb.trace_headers
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: ${ENVOY_RENDER_DIR}/lua/trace_headers.lua

                  # 1. Browser cookie → Authorization: Bearer, plus Origin/CSRF for mutations.
                  - name: bnpb.cookie_to_bearer
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      default_source_code:
                        filename: ${ENVOY_RENDER_DIR}/lua/cookie_to_bearer.lua

                  # 2. RFC 8693: exchange the opaque Zitadel access token for a JWT that
                  #    carries the role/scopes claims appended by the Auth bridge action.
                  - name: bnpb.token_exchange
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
                      dynamic_module_config:
                        name: composer
                        load_globally: true
                        metrics_namespace: builtonenvoy
                      filter_name: token-exchange
                      filter_config:
                        "@type": type.googleapis.com/google.protobuf.StringValue
                        value: |
                          {
                            "cluster": "zitadel",
                            "token_exchange_url": "${TOKEN_EXCHANGE_URL}",
                            "client_id": "${TOKEN_EXCHANGE_CLIENT_ID}",
                            "client_secret": "${TOKEN_EXCHANGE_CLIENT_SECRET}",
                            "requested_token_type": "urn:ietf:params:oauth:token-type:jwt"
                          }

                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      # No x-envoy-* timing or routing details in responses.
                      suppress_envoy_headers: true

  clusters:
    # --- Platform ---
    - name: zitadel
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options: &http2
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: zitadel
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${ZITADEL_ADDRESS}, port_value: ${ZITADEL_PORT} } } }

    - name: zitadel_login
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: zitadel_login
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${ZITADEL_LOGIN_ADDRESS}, port_value: ${ZITADEL_LOGIN_PORT} } } }

    - name: auth_bridge
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth_bridge
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${AUTH_BRIDGE_ADDRESS}, port_value: ${AUTH_BRIDGE_PORT} } } }

    - name: spa
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: spa
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${SPA_ADDRESS}, port_value: ${SPA_PORT} } } }

    # --- Business API (backends absent in the standalone Auth stack → 503 problem) ---
    - name: api_gateway
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: api_gateway
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${API_GATEWAY_ADDRESS}, port_value: ${API_GATEWAY_PORT} } } }

    # --- Observability (OTLP/gRPC; unresolvable in the standalone Auth stack → exports dropped) ---
    - name: otel_collector
      type: STRICT_DNS
      connect_timeout: 5s
      typed_extension_protocol_options: *http2
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint: { address: { socket_address: { address: ${OTEL_COLLECTOR_ADDRESS}, port_value: ${OTEL_COLLECTOR_GRPC_PORT} } } }
