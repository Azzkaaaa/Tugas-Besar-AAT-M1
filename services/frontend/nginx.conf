log_format bnpb_json escape=json '{"timestamp":"$time_iso8601","service":"spa-server",'
    '"trace_id":"$otel_trace_id","span_id":"$otel_span_id","correlation_id":"$http_x_correlation_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_seconds":$request_time,"bytes_sent":$body_bytes_sent}';

server {
    access_log /dev/stdout bnpb_json;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        otel_trace off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Requests for APIs must reach the Gateway in an integrated deployment.
    # Keep a missing API distinguishable from a successful SPA response.
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"gateway_unavailable","message":"Gateway API is not configured on this preview server."}}';
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        default_type application/json;
        return 503 '{"detail":"Auth requires the integrated reverse proxy. Use compose.auth.yaml for Zitadel login."}';
    }
}
