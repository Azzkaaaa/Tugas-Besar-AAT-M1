server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        otel_trace off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Requests for APIs must reach the Gateway in an integrated deployment.
    # Keep a missing API distinguishable from a successful SPA response.
    location /api/ {
        default_type application/json;
        return 503 '{"error":{"code":"gateway_unavailable","message":"Gateway API is not configured on this preview server."}}';
    }

    location /assets/ {
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        default_type application/json;
        return 503 '{"detail":"Auth requires the integrated reverse proxy. Use compose.auth.yaml for Zitadel login."}';
    }
}
