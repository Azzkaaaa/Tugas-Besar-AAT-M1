static_resources:
  listeners:
    - name: http
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: local_auth
                codec_type: AUTO
                use_remote_address: true
                # Access logs are omitted: OIDC callbacks contain single-use codes.
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: zitadel
                      domains: ["auth.localhost", "auth.localhost:8080"]
                      routes:
                        - match: {path: /}
                          redirect: {path_redirect: /ui/v2/login/}
                        - match: {prefix: /ui/v2/login}
                          route: {cluster: zitadel_login, timeout: 30s}
                        - match: {prefix: /}
                          route: {cluster: zitadel, timeout: 30s}
                    - name: application
                      domains: ["localhost", "localhost:8080", "api.localhost", "api.localhost:8080", "127.0.0.1:8080"]
                      routes:
                        - match: {prefix: /auth/}
                          route: {cluster: auth_bridge, timeout: 30s}
                        - match: {prefix: /api/}
                          route: {cluster: auth_bridge, timeout: 0s}
                        - match: {prefix: /}
                          route: {cluster: spa, timeout: 30s}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: zitadel
      type: STRICT_DNS
      connect_timeout: 5s
      http2_protocol_options: {}
      load_assignment:
        cluster_name: zitadel
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: zitadel, port_value: 8080}
    - name: zitadel_login
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: zitadel_login
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: zitadel-login, port_value: 3000}
    - name: auth_bridge
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: auth_bridge
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: auth-bridge, port_value: 3001}
    - name: spa
      type: STRICT_DNS
      connect_timeout: 5s
      load_assignment:
        cluster_name: spa
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: spa-server, port_value: 80}
