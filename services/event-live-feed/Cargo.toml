[package]
name = "event-live-feed"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bnpb-common = { path = "../../packages/bnpb-common-rust/bnpb-common" }
bnpb-event = { path = "../../packages/bnpb-event-rust/bnpb-event" }
bnpb-feed = { path = "../../packages/bnpb-feed-rust/bnpb-feed" }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hmac = "0.12"
http = "1"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
lapin = "2"
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prost = "0.14"
prost-types = "0.14"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }

[profile.release]
strip = true
lto = true
