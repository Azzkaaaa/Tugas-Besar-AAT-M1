# Independent preview while Gateway and Auth are still being developed.
# This explicitly enables simulated identities/data; it is not an Auth server.
services:
  spa-server:
    build:
      context: ./services/frontend
      args:
        VITE_APP_MODE: demo
        VITE_DATA_MODE: mock
        VITE_ENABLE_DEMO: "true"
        VITE_API_BASE_URL: /api/v1
    ports:
      - "${FRONTEND_HTTP_PORT:-5173}:80"
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

networks:
  bnpb_net:
    driver: bridge
