version: v2

inputs:
  - directory: ../..
    paths:
      - ../../contracts/proto/bnpb/aggregator

managed:
  enabled: true
  override:
      - file_option: csharp_namespace
        path: bnpb/aggregator/v1
        value: BNPB.Aggregator.V1

      - file_option: csharp_namespace
        path: bnpb/common/v1
        value: BNPB.Common.V1

plugins:
  - remote: buf.build/protocolbuffers/csharp
    out: BNPB.Aggregator/codegen

  - remote: buf.build/grpc/csharp
    out: BNPB.Aggregator/codegen
