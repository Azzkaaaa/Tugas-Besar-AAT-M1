syntax = "proto3";

package bnpb.aggregator.v1;

option go_package = "github.com/Azzkaaaa/Tugas-Besar-AAT-M1/packages/bnpb-aggregator-go/bnpb/aggregator/v1;aggregatorv1";

import "bnpb/common/v1/common.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// Internal read API over Aggregator's durable canonical store. Ingestion occurs
// through polling the mock REST sources; public clients cannot mutate hazards.
// Every method requires service identity and the original actor's bearer token.
service AggregatorService {
  // Requires hazards:read:summary. Counts all current canonical metadata, with
  // explicit storage incompleteness. TSUNAMI is a subset of SEISMIC.
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse) {
    option (google.api.http) = {get: "/api/v1/analytics"};
  }
  // Requires hazards:read:summary; FULL additionally requires hazards:read:full.
  rpc ListHazards(ListHazardsRequest) returns (ListHazardsResponse) {
    option (google.api.http) = {
      get: "/api/v1/hazards"
    };
  }

  // Same view scope requirements as ListHazards.
  // NOT_FOUND for an unknown hazard when relevant source data is usable;
  // UNAVAILABLE when no relevant source data is usable.
  rpc GetHazard(GetHazardRequest) returns (GetHazardResponse) {
    option (google.api.http) = {
      get: "/api/v1/hazards/{hazard_id}"
    };
  }

  // Requires hazards:read:summary. Returns both configured sources even if
  // either is unavailable; dependency failure of this service is UNAVAILABLE.
  rpc GetSourceStatuses(GetSourceStatusesRequest) returns (GetSourceStatusesResponse) {
    option (google.api.http) = {
      get: "/api/v1/hazards/sources/statuses"
    };
  }
}

message GetAnalyticsRequest {
  string source = 1;
  google.protobuf.Timestamp since = 2;
  google.protobuf.Timestamp until = 3;
  string interval = 4; // hour, day (default), month, year
}
message AnalyticsArea { string area_name = 1; int64 count = 2; }
message AnalyticsPoint { google.protobuf.Timestamp bucket = 1; map<string,int64> counts = 2; }
message GetAnalyticsResponse {
  int64 total = 1;
  map<string,int64> categories = 2;
  map<string,int64> severity = 3;
  repeated AnalyticsArea areas = 4;
  repeated AnalyticsPoint series = 5;
  bool partial = 6;
  repeated string unavailable_units = 7;
  google.protobuf.Timestamp as_of = 8;
}

message ListHazardsRequest {
  bnpb.common.v1.HazardFilter filter = 1;
  bnpb.common.v1.View view = 2;
  bnpb.common.v1.PageRequest page = 3;
}

message ListHazardsResponse {
  // Ordered by occurred_at descending, hazard_id ascending.
  repeated bnpb.common.v1.HazardProjection items = 1;
  string next_page_token = 2;
  // All sources relevant to the filter, including sources with no matches.
  repeated bnpb.common.v1.SourceFreshness freshness = 3;
  // True if source data is stale or some storage units could not be read.
  // A partial page's cursor must be retried before advancing past missing data.
  bool partial = 4;
  repeated string unavailable_units = 5;
}

message GetHazardRequest {
  string hazard_id = 1;
  bnpb.common.v1.View view = 2;
}

message GetHazardResponse {
  // Absent when the record's storage is unavailable (partial=true), which is
  // distinct from an authoritative NOT_FOUND response.
  bnpb.common.v1.HazardProjection item = 1;
  // Exactly one entry: the returned hazard's source.
  repeated bnpb.common.v1.SourceFreshness freshness = 2;
  bool partial = 3;
  repeated string unavailable_units = 4;
}

message GetSourceStatusesRequest {}

message GetSourceStatusesResponse {
  repeated bnpb.common.v1.SourceFreshness freshness = 1;
}
