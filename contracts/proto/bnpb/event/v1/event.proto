syntax = "proto3";

package bnpb.event.v1;

option go_package = "github.com/Azzkaaaa/Tugas-Besar-AAT-M1/packages/bnpb-aggregator-go/bnpb/event/v1;eventv1";

import "bnpb/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// RabbitMQ envelope, serialized as binary Protobuf (application/protobuf).
// Aggregator publishes after the canonical record is committed, using a
// transactional outbox or an equivalent durable publication mechanism.
// Publish both newly created records and source updates to existing records.
// At-least-once delivery: retrying a publish must preserve event_id and payload.
// All three subscribers receive independent copies on separate durable queues;
// do not share a queue across danger-notification, event-live-feed, and webhook-provider consumers.
message HazardEventPublished {
  // Unique per committed revision. Updates retain payload.hazard_id and
  // payload.ingested_at but have a new publication event_id and occurred_at.
  string event_id = 1;
  // Must equal 1 for this version of the envelope.
  uint32 schema_version = 2;
  // Must match payload.source.
  bnpb.common.v1.Source source = 3;
  // Service name; the only canonical publisher is "aggregator".
  string publisher = 4;
  string correlation_id = 5;
  // Publication event time; payload.occurred_at remains the hazard event time.
  google.protobuf.Timestamp occurred_at = 6;
  // Full internal payload. Each consumer must perform actor-specific projection
  // before returning data; broker access does not grant public FULL access.
  bnpb.common.v1.HazardEvent payload = 7;
}
