syntax = "proto3";

package bnpb.auth.v1;

// Requires x-service-token or edge-gateway credentials on RPCs.
//
// AuthService facilitates Token Transformation: converting external opaque
// session tokens (or cookie sessions) into short-lived, asymmetrically-signed JWTs
// intended strictly for internal microservice-to-microservice calls.
//
// Decentralized internal authorization model:
// 1. Edge/Gateway receives external session token from client.
// 2. Edge calls ExchangeToken to mint a short-lived internal JWT (RS256/ES256/EdDSA).
// 3. Internal resource servers fetch public keys via GetJWKS, cache them, and verify
//    JWT signatures and claims locally without calling AuthService per request.
service AuthService {
  // Exchanges an external opaque session token for a short-lived, asymmetrically-signed
  // internal JWT. Used by edge services or API gateways prior to forwarding requests downstream.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);

  // Authenticates external clients/users directly and issues an initial session
  // alongside an internal access JWT.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Atomically rotates an external refresh session and issues a new internal token pair.
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Revokes an external session, preventing future ExchangeToken or RefreshToken calls.
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Publishes the current signing key set (RFC 7517 JWKS) for internal microservices to
  // perform local verification of internal access-token JWTs. Public/Internal network;
  // also mirrored at GET /.well-known/jwks.json.
  rpc GetJWKS(GetJWKSRequest) returns (GetJWKSResponse);
}

enum ClientRole {
  CLIENT_ROLE_UNSPECIFIED = 0;
  CLIENT_ROLE_MEDIA = 1;
  CLIENT_ROLE_FIELD_TEAM = 2;
  CLIENT_ROLE_BNPB_INTERNAL = 3;
  CLIENT_ROLE_AGGREGATOR = 4;
}

// Request to transform an external session token into an internal asymmetric access JWT.
message ExchangeTokenRequest {
  // Opaque external session token or session cookie value provided by the client.
  string session_token = 1;

  // Target internal resource server or microservice domain (e.g., "service:disaster-relief").
  // Used to populate the JWT's "aud" claim.
  string target_audience = 2;
}

message ExchangeTokenResponse {
  // Asymmetrically signed compact JWT (RFC 7519) formatted for internal services.
  string access_token = 1;

  // TokenType is always "Bearer".
  string token_type = 2;

  // Short access lifetime in seconds (e.g., 60 to 300 seconds).
  int32 expires_in = 3;

  // Audience applied to the generated JWT.
  string audience = 4;
}

message LoginRequest {
  string client_id = 1;
  string client_secret = 2;
  string audience = 3;
}

message LoginResponse {
  TokenPair tokens = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string audience = 2;
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}

message TokenPair {
  // Compact asymmetric JWT for short-lived internal service access.
  string access_token = 1;
  string token_type = 2;
  int32 expires_in = 3;

  // Opaque refresh session token retained by external clients/gateways.
  string refresh_token = 4;
  int32 refresh_expires_in = 5;
}

message GetJWKSRequest {}

message GetJWKSResponse {
  // RFC 7517 JSON Web Key Set containing active public signing keys.
  string jwks_json = 1;
  int32 cache_max_age_seconds = 2;
  string etag = 3;
}

// Internal Access Token payload structure (decoded JWT claims) verified by microservices.
message Principal {
  string sub = 1;               // External User ID or Service Account (JWT "sub")
  int64 exp = 3; // JWT "exp"
  string iss = 5;                // Internal auth issuer (JWT "iss")
  repeated string aud = 6;     // Intended resource servers (JWT "aud")
  int64 iat = 7;  // JWT "iat"
  string jti = 8;              // Unique token identifier (JWT "jti")
  ClientRole client_role = 2;
  string session_id = 4;            // Underlying central session identifier
}
