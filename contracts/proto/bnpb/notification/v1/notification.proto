syntax = "proto3";

package bnpb.notification.v1;

import "bnpb/common/v1/common.proto";
import "google/protobuf/timestamp.proto";

// Consumes its own RabbitMQ queue and persists derived notifications. Only
// SEVERITY_SIAGA or SEVERITY_AWAS hazards create notifications. Deduplicate by
// published event_id. No external create/update/delete endpoint is exposed.
// Reads require service identity, the original actor token, notifications:read
// and hazards:read:summary; FULL additionally requires hazards:read:full.
service DangerNotificationService {
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);
}

message ListNotificationsRequest {
  // since/until apply to the hazard's occurred_at. NORMAL/WASPADA filters return
  // an empty list because those hazard levels do not create notifications.
  bnpb.common.v1.HazardFilter filter = 1;
  bnpb.common.v1.View view = 2;
  bnpb.common.v1.PageRequest page = 3;
}

message ListNotificationsResponse {
  // Frozen snapshot ordered by created_at descending, notification_id ascending.
  repeated DangerNotification items = 1;
  string next_page_token = 2;
  // Freshness of relevant sources, obtained from Aggregator using actor metadata.
  // Derived notifications may lag ingestion; this is upstream source freshness,
  // not an assertion that the consumer has processed the latest broker event.
  repeated bnpb.common.v1.SourceFreshness freshness = 3;
  // Same rules as ListHazards: true for any relevant STALE/UNAVAILABLE source;
  // fail UNAVAILABLE if every relevant source is UNAVAILABLE.
  bool partial = 4;
}

message GetNotificationRequest {
  string notification_id = 1;
  bnpb.common.v1.View view = 2;
}

message GetNotificationResponse {
  DangerNotification item = 1;
  // Exactly one entry: the returned notification hazard's source.
  repeated bnpb.common.v1.SourceFreshness freshness = 2;
  bool partial = 3;
}

message DangerNotification {
  string notification_id = 1;
  // Hazard state at notification creation, not a later mutable canonical value.
  bnpb.common.v1.HazardProjection hazard = 2;
  // Generated exclusively from summary-safe hazard fields. Do not interpolate
  // source_ref_id, coordinates, attributes or other restricted upstream data.
  string message = 3;
  google.protobuf.Timestamp created_at = 4;
}
