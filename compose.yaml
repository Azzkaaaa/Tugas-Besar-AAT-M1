services:
  envoy:
    extends:
      file: compose.auth.yaml
      service: envoy

  auth-db:
    extends:
      file: compose.auth.yaml
      service: auth-db

  zitadel-login:
    extends:
      file: compose.auth.yaml
      service: zitadel-login

  auth-bootstrap:
    extends:
      file: compose.auth.yaml
      service: auth-bootstrap

  auth-bridge:
    extends:
      file: compose.auth.yaml
      service: auth-bridge
    environment:
      GATEWAY_UPSTREAM_URL: http://gateway-transcoder:8080

  # Private boundary: public API traffic must pass Auth bridge first.
  gateway-transcoder:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./services/envoy/sse_filter.lua:/etc/envoy/lua/sse_filter.lua:ro
      - ./services/envoy/bnpb_descriptor.pb:/etc/envoy/bnpb_descriptor.pb:ro
    networks:
      bnpb_net: {}

  zitadel:
    extends:
      file: compose.auth.yaml
      service: zitadel

  spa-server:
    build:
      context: ./services/frontend
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: gateway
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-/api/v1}"
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - webhook-service.local

  notification-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  rabbitmq:
    image: rabbitmq:4-management
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_sessions:
  bmkg_data:
  pvmbg_data:
