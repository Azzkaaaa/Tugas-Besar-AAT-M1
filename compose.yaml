services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # grafana ui
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
      - "9090:9090"   # prome or mimir idk
    environment:
      - ENABLE_OBI=false
    networks:
      bnpb_net:
        aliases:
          - otel-lgtm.local
  # envoy:
  #   image: envoyproxy/envoy:v1.31-latest
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
  #     - ./services/envoy/sse_filter.lua:/etc/envoy/lua/sse_filter.lua:ro
  #     - ./services/envoy/bnpb_descriptor.pb:/etc/envoy/bnpb_descriptor.pb:ro
  #   networks:
  #     bnpb_net:
  #       aliases:
  #         - envoy.local
  #         - auth.localhost
  #     internet_mock_net:
  #       aliases:
  #         - api.localhost
  #         - auth.localhost

  zitadel:
    # Requires CockroachDB/Postgres in a full deployment
    image: ghcr.io/zitadel/zitadel:latest
    command: 'start-from-init --masterkey "a-32-byte-long-secret-key-change-me"'
    networks:
      bnpb_net:
        aliases:
          - zitadel.local

  spa-server:
    # Set your image/build context here
    image: nginx:alpine
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-provider:
    build:
      context: .
      dockerfile: services/webhook-provider/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=webhook-provider
    ports:
      - "9094:9094"
    volumes:
      - webhook_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - webhook-provider.local

  notification-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=aggregator-service
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bnpb_canonical
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
  webhook_data:
