services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "3000:3000"   # grafana ui
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
      - "9090:9090"   # prome or mimir idk
    environment:
      - ENABLE_OBI=false
      # Adds Postgres and RabbitMQ scraping to the built-in collector (services/otel-lgtm).
      - OTELCOL_EXTRA_ARGS=--config=file:./otelcol-extra.yaml
      - AGGREGATOR_DB_PASSWORD=postgres
      - AUTH_POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./services/otel-lgtm/otelcol-extra.yaml:/otel-lgtm/otelcol-extra.yaml:ro
      # Tempo span metrics and service graph split outgoing calls by target.
      - ./services/otel-lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      # BNPB alert rules and the "BNPB Health & Traces" dashboard.
      - ./services/otel-lgtm/grafana/alerting/bnpb-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/bnpb-rules.yaml:ro
      - ./services/otel-lgtm/grafana/dashboards/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/bnpb.yaml:ro
      - ./services/otel-lgtm/grafana/dashboards:/otel-lgtm/bnpb-dashboards:ro
    networks:
      bnpb_net:
        aliases:
          - otel-lgtm.local

  # Health probes (HTTP, gRPC health, TCP), scraped by the otel-lgtm collector.
  # Targets are in services/otel-lgtm/otelcol-extra.yaml; modules in services/blackbox.
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./services/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Service names still resolve through Docker's embedded DNS. Unknown names fail at once
    # instead of going upstream: grpc-go looks up a _grpc_config TXT record before every dial,
    # and a slow upstream resolver turns each gRPC probe into a 10 s scrape timeout.
    dns: [127.0.0.1]
    networks:
      bnpb_net:
        aliases:
          - blackbox.local

  envoy:
    extends:
      file: compose.auth.yaml
      service: envoy
    depends_on:
      otel-lgtm:
        condition: service_started

  api-gateway:
    extends:
      file: compose.auth.yaml
      service: api-gateway
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: api-gateway

  auth-db:
    extends:
      file: compose.auth.yaml
      service: auth-db

  zitadel-login:
    extends:
      file: compose.auth.yaml
      service: zitadel-login
    # The image's Next.js instrumentation starts the OTel Node SDK; these point it at otel-lgtm.
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_SERVICE_NAME: zitadel-login
    depends_on:
      otel-lgtm:
        condition: service_started

  auth-bootstrap:
    extends:
      file: compose.auth.yaml
      service: auth-bootstrap

  auth-bridge:
    extends:
      file: compose.auth.yaml
      service: auth-bridge
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: auth-bridge
      # Undici records http.client.request.duration for the calls to Zitadel.
      OTEL_METRICS_EXPORTER: otlp
    depends_on:
      otel-lgtm:
        condition: service_started

  zitadel-claims:
    extends:
      file: compose.auth.yaml
      service: zitadel-claims
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: zitadel-claims
    depends_on:
      otel-lgtm:
        condition: service_started

  zitadel:
    extends:
      file: compose.auth.yaml
      service: zitadel
    environment:
      ZITADEL_INSTRUMENTATION_SERVICENAME: zitadel
      # "auto" hands exporter selection to the standard OTEL_* variables below.
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: auto
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE: auto
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE: auto
      # Local stack only: joins Envoy's trace instead of starting a new one. Do not reuse.
      ZITADEL_INSTRUMENTATION_TRACE_TRUSTREMOTESPANS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      otel-lgtm:
        condition: service_started

  spa-server:
    build:
      context: ./services/frontend
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: gateway
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-/api/v1}"
    environment:
      # ngx_otel_module exports over gRPC only.
      NGINX_OTEL_TRACE: "on"
      NGINX_OTEL_ENDPOINT: otel-lgtm:4317
    depends_on:
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-provider:
    build:
      context: .
      dockerfile: services/webhook-provider/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=webhook-provider
      - AUTH_AUTHORITY=${WEBHOOK_AUTH_AUTHORITY:-http://auth.localhost:8080}
      - AUTH_INSECURE_SKIP_VERIFY=${AUTH_INSECURE_SKIP_VERIFY:-false}
    ports:
      - "9094:9094"
    # Lets e2e tests (tests/test_e2e_webhooks.py) receive deliveries on the host under Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - webhook_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - webhook-provider.local

  notification-service:
    build:
      context: .
      dockerfile: services/danger-notification/Dockerfile
    environment:
      Aggregator__Address: http://aggregator-service:9091
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE}
      RabbitMq__QueueName: ${CONSUMER_3_QUEUE}
      RabbitMq__DeadLetterQueue: ${CONSUMER_3_DLQ}
      Auth__Authority: ${NOTIFICATION_AUTH_AUTHORITY:-http://auth.localhost:8080}
      # The local Zitadel only serves plain HTTP.
      Auth__RequireHttpsMetadata: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: danger-notification
    ports:
      - "9095:9095"
    volumes:
      # Long syntax so a missing file fails instead of Docker creating a directory.
      - type: bind
        source: ${FIREBASE_CREDENTIALS_PATH:-./.secrets/firebase-credentials.json}
        target: /run/secrets/firebase-credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      aggregator-service:
        condition: service_started
      otel-lgtm:
        condition: service_started
    # The RabbitMQ consumer connects once at startup.
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    build:
      context: .
      dockerfile: services/event-live-feed/Dockerfile
    environment:
      EVENT_FEED_GRPC_PORT: ${EVENT_FEED_GRPC_PORT:-9093}
      EVENT_FEED_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      CONSUMER_1_QUEUE: ${CONSUMER_1_QUEUE}
      CONSUMER_1_DLQ: ${CONSUMER_1_DLQ}
      FEED_REPLAY_RETENTION_SECONDS: ${FEED_REPLAY_RETENTION_SECONDS:-600}
      FEED_REPLAY_MAX_ENTRIES: ${FEED_REPLAY_MAX_ENTRIES:-10000}
      FEED_AUTH_AUTHORITY: ${FEED_AUTH_AUTHORITY:-http://auth.localhost:8080}
      FEED_TOKEN_RENEW_BEFORE_SECONDS: ${FEED_TOKEN_RENEW_BEFORE_SECONDS:-15}
      FEED_MAX_STREAM_SECONDS: ${FEED_MAX_STREAM_SECONDS:-3600}
      # Token-exchange client provisioned by auth-bootstrap (feed_client_id/secret).
      OIDC_CONFIG_FILE: /bootstrap/oidc.json
      FEED_TOKEN_EXCHANGE_CLIENT_ID: ${FEED_TOKEN_EXCHANGE_CLIENT_ID:-}
      FEED_TOKEN_EXCHANGE_CLIENT_SECRET: ${FEED_TOKEN_EXCHANGE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: event-live-feed
    ports:
      - "9093:9093"
    volumes:
      - auth_client_config:/bootstrap:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      # The token-exchange client is read once at startup.
      auth-bootstrap:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=aggregator-service
      - AUTH_AUTHORITY=${AGGREGATOR_AUTH_AUTHORITY:-http://auth.localhost:8080}
      - AUTH_INSECURE_SKIP_VERIFY=${AUTH_INSECURE_SKIP_VERIFY:-false}
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bnpb_canonical
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_actions_config:
  auth_sessions:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
  webhook_data:
