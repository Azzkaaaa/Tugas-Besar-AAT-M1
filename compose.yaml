services:
  envoy:
    extends:
      file: compose.auth.yaml
      service: envoy

  auth-db:
    extends:
      file: compose.auth.yaml
      service: auth-db

  zitadel-login:
    extends:
      file: compose.auth.yaml
      service: zitadel-login

  auth-bootstrap:
    extends:
      file: compose.auth.yaml
      service: auth-bootstrap

  auth-bridge:
    extends:
      file: compose.auth.yaml
      service: auth-bridge
    environment:
      GATEWAY_UPSTREAM_URL: http://gateway-transcoder:8080

  # Private boundary: public API traffic must pass Auth bridge first.
  gateway-transcoder:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./services/envoy/sse_filter.lua:/etc/envoy/lua/sse_filter.lua:ro
      - ./services/envoy/bnpb_descriptor.pb:/etc/envoy/bnpb_descriptor.pb:ro
    networks:
      bnpb_net: {}

  zitadel:
    extends:
      file: compose.auth.yaml
      service: zitadel

  spa-server:
    build:
      context: ./services/frontend
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: gateway
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-/api/v1}"
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-provider:
    build:
      context: .
      dockerfile: services/webhook-provider/Dockerfile
    env_file:
      - .env
    ports:
      - "9094:9094"
    volumes:
      - webhook_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      bnpb_net:
        aliases:
          - webhook-provider.local

  notification-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    env_file:
      - .env
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bnpb_canonical
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_sessions:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
  webhook_data:
