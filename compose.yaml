services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "8080:8080"
    volumes:
      - ./services/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./services/envoy/sse_filter.lua:/etc/envoy/lua/sse_filter.lua:ro
      - ./services/envoy/bnpb_descriptor.pb:/etc/envoy/bnpb_descriptor.pb:ro
    networks:
      bnpb_net:
        aliases:
          - envoy.local
          - auth.localhost
      internet_mock_net:
        aliases:
          - api.localhost
          - auth.localhost

  zitadel:
    # Requires CockroachDB/Postgres in a full deployment
    image: ghcr.io/zitadel/zitadel:latest
    command: 'start-from-init --masterkey "a-32-byte-long-secret-key-change-me"'
    networks:
      bnpb_net:
        aliases:
          - zitadel.local

  spa-server:
    # Set your image/build context here
    image: nginx:alpine
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - webhook-service.local

  notification-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    # Set your image/build context here
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    environment:
      BMKG_BASE_URL: http://bmkg.localhost:8080
      PVMBG_BASE_URL: http://pvmbg.localhost:8080
      BMKG_API_KEY: ${BMKG_API_KEY}
      PVMBG_BEARER_TOKEN: ${PVMBG_BEARER_TOKEN}
      AGGREGATOR_GRPC_PORT: "9091"
      CANONICAL_STORE_DSN: postgres://aggregator:postgres@aggregator-db.local:5432/bnpb_canonical?sslmode=disable
      AGGREGATOR_AMQP_URL: amqp://guest:guest@rabbitmq.local:5672/
      RABBITMQ_EXCHANGE: bnpb.hazards.v1
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bnpb_canonical
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - 5672:5672
      - 15672:15672
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
