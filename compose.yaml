services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # grafana ui
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
      - "9090:9090"   # prome or mimir idk
    environment:
      - ENABLE_OBI=false
    networks:
      bnpb_net:
        aliases:
          - otel-lgtm.local

  envoy:
    extends:
      file: compose.auth.yaml
      service: envoy

  auth-db:
    extends:
      file: compose.auth.yaml
      service: auth-db

  zitadel-login:
    extends:
      file: compose.auth.yaml
      service: zitadel-login

  auth-bootstrap:
    extends:
      file: compose.auth.yaml
      service: auth-bootstrap

  auth-bridge:
    extends:
      file: compose.auth.yaml
      service: auth-bridge

  zitadel-claims:
    extends:
      file: compose.auth.yaml
      service: zitadel-claims

  zitadel:
    extends:
      file: compose.auth.yaml
      service: zitadel

  spa-server:
    build:
      context: ./services/frontend
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: gateway
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-/api/v1}"
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-provider:
    build:
      context: .
      dockerfile: services/webhook-provider/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=webhook-provider
    ports:
      - "9094:9094"
    volumes:
      - webhook_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - webhook-provider.local

  notification-service:
    build:
      context: .
      dockerfile: services/danger-notification/Dockerfile
    environment:
      Aggregator__Address: http://aggregator-service:9091
      RabbitMq__HostName: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}
      RabbitMq__QueueName: ${CONSUMER_3_QUEUE}
      RabbitMq__DeadLetterQueue: ${CONSUMER_3_DLQ}
      Auth__Authority: ${NOTIFICATION_AUTH_AUTHORITY:-http://auth.localhost:8080}
      # The local Zitadel only serves plain HTTP.
      Auth__RequireHttpsMetadata: "false"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
    ports:
      - "9095:9095"
    volumes:
      # Long syntax so a missing file fails instead of Docker creating a directory.
      - type: bind
        source: ${FIREBASE_CREDENTIALS_PATH:-./.secrets/firebase-credentials.json}
        target: /run/secrets/firebase-credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      aggregator-service:
        condition: service_started
    # The RabbitMQ consumer connects once at startup.
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  #feed-service:
  #  # Set your image/build context here
  #  networks:
  #    bnpb_net:
  #      aliases:
  #        - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    env_file:
      - .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=aggregator-service
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
      otel-lgtm:
        condition: service_started
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bnpb_canonical
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_actions_config:
  auth_sessions:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
  webhook_data:
