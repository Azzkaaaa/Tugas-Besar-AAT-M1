services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "3000:3000"   # grafana ui
      - "4317:4317"   # otlp grpc
      - "4318:4318"   # otlp http
      - "9090:9090"   # prome or mimir idk
    environment:
      - ENABLE_OBI=false
      # Adds Postgres and RabbitMQ scraping to the built-in collector (services/otel-lgtm).
      - OTELCOL_EXTRA_ARGS=--config=file:./otelcol-extra.yaml
      - AGGREGATOR_DB_PASSWORD=${AGGREGATOR_DB_PASSWORD}
      - AUTH_POSTGRES_PASSWORD=${AUTH_POSTGRES_PASSWORD}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./services/otel-lgtm/otelcol-extra.yaml:/otel-lgtm/otelcol-extra.yaml:ro
      # Tempo span metrics and service graph split outgoing calls by target.
      - ./services/otel-lgtm/tempo-config.yaml:/otel-lgtm/tempo-config.yaml:ro
      # BNPB alert rules and the "BNPB Health & Traces" dashboard.
      - ./services/otel-lgtm/grafana/alerting/bnpb-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/bnpb-rules.yaml:ro
      - ./services/otel-lgtm/grafana/dashboards/provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/bnpb.yaml:ro
      - ./services/otel-lgtm/grafana/dashboards:/otel-lgtm/bnpb-dashboards:ro
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - otel-lgtm.local

  # Health probes (HTTP, gRPC health, TCP), scraped by the otel-lgtm collector.
  # Targets are in services/otel-lgtm/otelcol-extra.yaml; modules in services/blackbox.
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./services/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Service names still resolve through Docker's embedded DNS. Unknown names fail at once
    # instead of going upstream: grpc-go looks up a _grpc_config TXT record before every dial,
    # and a slow upstream resolver turns each gRPC probe into a 10 s scrape timeout.
    dns: [127.0.0.1]
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - blackbox.local

  envoy:
    extends:
      file: compose.auth.yaml
      service: envoy
    depends_on:
      otel-lgtm:
        condition: service_started

  token-exchange:
    extends:
      file: compose.auth.yaml
      service: token-exchange
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: token-exchange
    depends_on:
      otel-lgtm:
        condition: service_started

  api-gateway:
    extends:
      file: compose.auth.yaml
      service: api-gateway
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: api-gateway

  auth-db:
    extends:
      file: compose.auth.yaml
      service: auth-db

  zitadel-login:
    extends:
      file: compose.auth.yaml
      service: zitadel-login
    # The image's Next.js instrumentation starts the OTel Node SDK; these point it at otel-lgtm.
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_SERVICE_NAME: zitadel-login
    depends_on:
      otel-lgtm:
        condition: service_started

  auth-bootstrap:
    extends:
      file: compose.auth.yaml
      service: auth-bootstrap

  auth-bridge:
    extends:
      file: compose.auth.yaml
      service: auth-bridge
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: auth-bridge
      # Undici records http.client.request.duration for the calls to Zitadel.
      OTEL_METRICS_EXPORTER: otlp
    depends_on:
      otel-lgtm:
        condition: service_started

  zitadel-claims:
    extends:
      file: compose.auth.yaml
      service: zitadel-claims
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: zitadel-claims
    depends_on:
      otel-lgtm:
        condition: service_started

  zitadel:
    extends:
      file: compose.auth.yaml
      service: zitadel
    environment:
      ZITADEL_INSTRUMENTATION_SERVICENAME: zitadel
      # "auto" hands exporter selection to the standard OTEL_* variables below.
      ZITADEL_INSTRUMENTATION_TRACE_EXPORTER_TYPE: auto
      ZITADEL_INSTRUMENTATION_METRIC_EXPORTER_TYPE: auto
      ZITADEL_INSTRUMENTATION_LOG_EXPORTER_TYPE: auto
      # Local stack only: joins Envoy's trace instead of starting a new one. Do not reuse.
      ZITADEL_INSTRUMENTATION_TRACE_TRUSTREMOTESPANS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      otel-lgtm:
        condition: service_started

  spa-server:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_APP_MODE: oidc
        VITE_DATA_MODE: gateway
        VITE_ENABLE_DEMO: "false"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-/api/v1}"
        VITE_FIREBASE_API_KEY: "${FIREBASE_WEB_API_KEY:-}"
        VITE_FIREBASE_PROJECT_ID: "${FIREBASE_WEB_PROJECT_ID:-}"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "${FIREBASE_WEB_MESSAGING_SENDER_ID:-}"
        VITE_FIREBASE_APP_ID: "${FIREBASE_WEB_APP_ID:-}"
        VITE_FIREBASE_VAPID_KEY: "${FIREBASE_WEB_VAPID_KEY:-}"
    environment:
      # ngx_otel_module exports over gRPC only.
      NGINX_OTEL_TRACE: "on"
      NGINX_OTEL_ENDPOINT: otel-lgtm:4317
    depends_on:
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - spa-server.local

  webhook-provider:
    build:
      context: .
      dockerfile: services/webhook-provider/Dockerfile
    profiles:
      - manual
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WEBHOOK_GRPC_PORT: ${WEBHOOK_GRPC_PORT:-9094}
      WEBHOOK_STORE_DSN: postgres://webhook:${WEBHOOK_DB_PASSWORD}@webhook-db.local:5432/webhook?sslmode=disable
      # Delivery dedup claims, shared by every replica.
      WEBHOOK_REDIS_URL: redis://webhook-redis.local:6379/0
      WEBHOOK_AMQP_URL: ${WEBHOOK_AMQP_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      WEBHOOK_CONSUMER_QUEUE: ${WEBHOOK_CONSUMER_QUEUE:-bnpb.webhook-provider.v1}
      WEBHOOK_CONSUMER_DLQ: ${WEBHOOK_CONSUMER_DLQ:-bnpb.webhook-provider.dlq.v1}
      WEBHOOK_SERVICE_TOKEN: ${WEBHOOK_SERVICE_TOKEN}
      WEBHOOK_MAX_RETRIES: ${WEBHOOK_MAX_RETRIES:-5}
      WEBHOOK_HTTP_TIMEOUT_MS: ${WEBHOOK_HTTP_TIMEOUT_MS:-10000}
      WEBHOOK_DEDUP_TTL_HOURS: ${WEBHOOK_DEDUP_TTL_HOURS:-168}
      AUTH_AUTHORITY: ${WEBHOOK_AUTH_AUTHORITY:-http://auth.localhost:8080}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_INSECURE_SKIP_VERIFY: ${AUTH_INSECURE_SKIP_VERIFY:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: webhook-provider
    ports:
      - "9094:9094"
    # Lets e2e tests (tests/test_e2e_webhooks.py) receive deliveries on the host under Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      webhook-db:
        condition: service_healthy
      webhook-redis:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - webhook-provider.local

  notification-service:
    build:
      context: .
      dockerfile: services/danger-notification/Dockerfile
    # appsettings.json overrides (Section__Key) from the NOTIFICATION_* variables in .env.
    environment:
      Kestrel__Endpoints__Grpc__Url: http://0.0.0.0:${NOTIFICATION_GRPC_PORT:-9095}
      Aggregator__Address: http://${AGGREGATOR_GRPC_ADDRESS:-aggregator-service:9091}
      RabbitMq__HostName: ${NOTIFICATION_RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: ${NOTIFICATION_RABBITMQ_PORT:-5672}
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS}
      RabbitMq__VirtualHost: ${RABBITMQ_DEFAULT_VHOST}
      RabbitMq__Exchange: ${RABBITMQ_EXCHANGE}
      RabbitMq__QueueName: ${NOTIFICATION_CONSUMER_QUEUE}
      RabbitMq__DeadLetterQueue: ${NOTIFICATION_CONSUMER_DLQ}
      Fcm__Topic: ${NOTIFICATION_FCM_TOPIC:-hazard-alerts}
      Persistence__Provider: postgres
      ConnectionStrings__Notifications: Host=notification-db.local;Port=5432;Database=notifications;Username=notification;Password=${NOTIFICATION_DB_PASSWORD}
      Auth__Authority: ${NOTIFICATION_AUTH_AUTHORITY:-http://auth.localhost:8080}
      # The local Zitadel only serves plain HTTP.
      Auth__RequireHttpsMetadata: ${NOTIFICATION_AUTH_REQUIRE_HTTPS_METADATA:-false}
      Auth__ScopeClaim: ${NOTIFICATION_AUTH_SCOPE_CLAIM:-scopes}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-credentials.json
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: danger-notification
    ports:
      - "9095:9095"
    volumes:
      # Long syntax so a missing file fails instead of Docker creating a directory.
      - type: bind
        source: ${FIREBASE_CREDENTIALS_PATH:-./.secrets/firebase-credentials.json}
        target: /run/secrets/firebase-credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      aggregator-service:
        condition: service_started
      otel-lgtm:
        condition: service_started
    # The RabbitMQ consumer connects once at startup.
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - notification-service.local

  feed-service:
    build:
      context: .
      dockerfile: services/event-live-feed/Dockerfile
    environment:
      EVENT_FEED_GRPC_PORT: ${EVENT_FEED_GRPC_PORT:-9093}
      EVENT_FEED_AMQP_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/${RABBITMQ_DEFAULT_VHOST}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      EVENT_FEED_CONSUMER_QUEUE: ${EVENT_FEED_CONSUMER_QUEUE}
      EVENT_FEED_CONSUMER_DLQ: ${EVENT_FEED_CONSUMER_DLQ}
      FEED_REPLAY_RETENTION_SECONDS: ${FEED_REPLAY_RETENTION_SECONDS:-600}
      FEED_REPLAY_MAX_ENTRIES: ${FEED_REPLAY_MAX_ENTRIES:-10000}
      # Replay buffer shared by every replica.
      FEED_REDIS_URL: redis://feed-redis.local:6379/0
      FEED_AUTH_AUTHORITY: ${FEED_AUTH_AUTHORITY:-http://auth.localhost:8080}
      FEED_TOKEN_RENEW_BEFORE_SECONDS: ${FEED_TOKEN_RENEW_BEFORE_SECONDS:-15}
      FEED_MAX_STREAM_SECONDS: ${FEED_MAX_STREAM_SECONDS:-3600}
      # Token-exchange client provisioned by auth-bootstrap (feed_client_id/secret).
      OIDC_CONFIG_FILE: /bootstrap/oidc.json
      FEED_TOKEN_EXCHANGE_CLIENT_ID: ${FEED_TOKEN_EXCHANGE_CLIENT_ID:-}
      FEED_TOKEN_EXCHANGE_CLIENT_SECRET: ${FEED_TOKEN_EXCHANGE_CLIENT_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: event-live-feed
    ports:
      - "9093:9093"
    volumes:
      - auth_client_config:/bootstrap:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      feed-redis:
        condition: service_healthy
      # The token-exchange client is read once at startup.
      auth-bootstrap:
        condition: service_completed_successfully
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - feed-service.local

  aggregator-service:
    build:
      context: .
      dockerfile: services/aggregator/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGGREGATOR_GRPC_PORT: ${AGGREGATOR_GRPC_PORT:-9091}
      BMKG_BASE_URL: ${BMKG_BASE_URL:-http://bmkg-mock:8080}
      PVMBG_BASE_URL: ${PVMBG_BASE_URL:-http://pvmbg-mock:8080}
      BMKG_API_KEY: ${BMKG_API_KEY}
      PVMBG_BEARER_TOKEN: ${PVMBG_BEARER_TOKEN}
      BMKG_POLL_INTERVAL_MS: ${BMKG_POLL_INTERVAL_MS:-3000}
      PVMBG_POLL_INTERVAL_MS: ${PVMBG_POLL_INTERVAL_MS:-3000}
      BMKG_REQUEST_TIMEOUT_MS: ${BMKG_REQUEST_TIMEOUT_MS:-1000}
      PVMBG_REQUEST_TIMEOUT_MS: ${PVMBG_REQUEST_TIMEOUT_MS:-3500}
      SOURCE_STALE_AFTER_MS: ${SOURCE_STALE_AFTER_MS:-10000}
      CANONICAL_STORE_DSN: postgres://aggregator:${AGGREGATOR_DB_PASSWORD}@aggregator-db.local:5432/bnpb_canonical?sslmode=disable
      AGGREGATOR_AMQP_URL: ${AGGREGATOR_AMQP_URL}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      OUTBOX_MAX_RETRIES: ${OUTBOX_MAX_RETRIES:-5}
      AGGREGATOR_SERVICE_TOKEN: ${AGGREGATOR_SERVICE_TOKEN}
      AUTH_AUTHORITY: ${AGGREGATOR_AUTH_AUTHORITY:-http://auth.localhost:8080}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_INSECURE_SKIP_VERIFY: ${AUTH_INSECURE_SKIP_VERIFY:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: aggregator-service
    ports:
      - "9091:9091"
    depends_on:
      aggregator-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      bmkg-mock:
        condition: service_started
      pvmbg-mock:
        condition: service_started
      otel-lgtm:
        condition: service_started
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - aggregator-service.local
      internet_mock_net:
        aliases:
          - aggregator.localhost

  aggregator-db:
    image: postgres:17
    environment:
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: ${AGGREGATOR_DB_PASSWORD}
      POSTGRES_DB: bnpb_canonical
    # Local development only: lets host tools (psql, GUI clients) inspect the canonical store.
    # No service needs it; the aggregator and the otel collector connect over bnpb_net.
    # Remove this mapping outside local development.
    ports:
      - "5432:5432"
    volumes:
      - aggregator_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - aggregator-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aggregator -d bnpb_canonical"]
      interval: 5s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:17
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: notifications
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - notification-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notifications"]
      interval: 5s
      timeout: 5s
      retries: 5

  webhook-db:
    image: postgres:17
    profiles:
      - manual
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: ${WEBHOOK_DB_PASSWORD}
      POSTGRES_DB: webhook
    volumes:
      - webhook_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - webhook-db.local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Delivery dedup claims of webhook-provider, shared by its replicas. Ephemeral by choice:
  # lost keys only allow an at-least-once resend. noeviction makes a full Redis fail writes
  # loudly instead of silently dropping claims.
  webhook-redis:
    image: redis:8
    profiles:
      - manual
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - webhook-redis.local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Replay buffer of feed-service, shared by its replicas. Ephemeral by choice: lost keys
  # start a new epoch (clients take a new snapshot). noeviction for the same reason as above.
  feed-redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    networks:
      bnpb_net:
        aliases:
          - feed-redis.local
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq-node
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - 5672:5672
      - 15672:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      bnpb_net:
        aliases:
          - rabbitmq.local

  bmkg-mock:
    extends:
      file: compose.mocks.yaml
      service: bmkg-mock

  pvmbg-mock:
    extends:
      file: compose.mocks.yaml
      service: pvmbg-mock

networks:
  internet_mock_net:
    driver: bridge
  bnpb_net:
    driver: bridge
  bmkg_net:
    driver: bridge
  pvmbg_net:
    driver: bridge

volumes:
  auth_postgres:
  zitadel_admin_bootstrap:
  zitadel_login_bootstrap:
  auth_client_config:
  auth_actions_config:
  auth_sessions:
  bmkg_data:
  pvmbg_data:
  aggregator_data:
  webhook_db_data:
  notification_db_data:
  rabbitmq_data:
